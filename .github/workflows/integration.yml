name: Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore AlteredDestination.Tests/AlteredDestination.Tests.csproj

      - name: Build
        run: dotnet build AlteredDestination.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test AlteredDestination.Tests/AlteredDestination.Tests.csproj --configuration Release
